<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>👔 Zarząd | Mazowieckie Paliwa S.A.</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family: Arial, sans-serif;

    background: #071525;

    color: white;

    min-height: 100vh;
}


header {

    background: #0b1f35;

    border-bottom: 3px solid #f5c400;

    padding: 15px 6%;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.logo {

    display: flex;

    align-items: center;

    gap: 12px;
}


.logo img {

    width: 75px;

    height: 55px;

    object-fit: contain;
}


.logo-text {

    font-size: 20px;

    font-weight: bold;
}


.logo-text span {

    color: #f5c400;
}


header a {

    color: white;

    text-decoration: none;

    font-weight: bold;
}


header a:hover {

    color: #f5c400;
}


.container {

    width: 92%;

    max-width: 900px;

    margin: 60px auto;
}


.panel {

    background: #0b1f35;

    border: 1px solid #203b55;

    border-radius: 16px;

    padding: 35px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}


#loginScreen {

    max-width: 500px;

    margin: 100px auto;

    text-align: center;
}


h1 {

    font-size: 45px;

    margin-bottom: 15px;
}


h1 span {

    color: #f5c400;
}


.description {

    color: #aebdcb;

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 30px;
}


input {

    width: 100%;

    padding: 14px;

    border-radius: 8px;

    border: 1px solid #38516a;

    background: #071525;

    color: white;

    font-size: 16px;
}


input:focus {

    outline: none;

    border-color: #f5c400;
}


.main-button {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 10px;

    background: #f5c400;

    color: #071525;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


.main-button:hover {

    background: #ffd92e;
}


.login-error {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 8px;

    background: #421b1b;

    color: #ff8c8c;

    font-weight: bold;
}


#managementPanel {

    display: none;
}


.status {

    text-align: center;

    padding: 35px;

    border-radius: 14px;

    margin: 30px 0;
}


.status.open {

    background: #123c2a;

    border: 1px solid #58d68d;
}


.status.closed {

    background: #421b1b;

    border: 1px solid #ff6b6b;
}


.status-icon {

    font-size: 70px;

    margin-bottom: 15px;
}


.status-title {

    font-size: 32px;

    font-weight: bold;

    margin-bottom: 10px;
}


.status-text {

    color: #cbd6df;

    font-size: 17px;
}


.actions {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


.action {

    padding: 22px;

    border-radius: 10px;

    border: 1px solid #38516a;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


.open-button {

    background: #123c2a;

    color: #58d68d;

    border-color: #58d68d;
}


.close-button {

    background: #421b1b;

    color: #ff7777;

    border-color: #ff7777;
}


.message {

    text-align: center;

    margin-top: 20px;

    color: #f5c400;

    font-weight: bold;
}


@media(max-width:700px) {

    header {

        flex-direction: column;

        gap: 15px;

        text-align: center;
    }

    .actions {

        grid-template-columns: 1fr;
    }

    h1 {

        font-size: 36px;
    }

    .panel {

        padding: 20px;
    }
}

</style>

</head>


<body>


<header>

    <div class="logo">

        <img
            src="/1000013536.png"
            alt="Mazowieckie Paliwa S.A."
        >

        <div class="logo-text">

            MAZOWIECKIE
            <span>PALIWA</span>
            S.A.

        </div>

    </div>


    <a href="/">
        ← Strona główna
    </a>

</header>


<main class="container">


<!-- LOGOWANIE -->

<section
    id="loginScreen"
    class="panel"
>

    <div style="font-size:70px;">
        👔
    </div>


    <h1>
        Panel <span>zarządu</span>
    </h1>


    <p class="description">

        Podaj kod dostępu zarządu,
        aby zarządzać stacją.

    </p>


    <input
        id="accessCode"
        type="password"
        placeholder="Kod dostępu"
        autocomplete="off"
    >


    <button
        class="main-button"
        onclick="login()"
    >

        🔓 WEJDŹ DO PANELU

    </button>


    <div
        id="loginError"
        class="login-error"
    >

        ❌ Nieprawidłowy kod dostępu.

    </div>

</section>



<!-- PANEL ZARZĄDU -->

<section
    id="managementPanel"
    class="panel"
>

    <h1>
        Zarządzanie <span>stacją</span>
    </h1>


    <p class="description">

        Tutaj zarząd może otwierać
        i zamykać stację.

    </p>


    <div
        id="statusBox"
        class="status"
    >

        <div
            id="statusIcon"
            class="status-icon"
        >
            ⏳
        </div>


        <div
            id="statusTitle"
            class="status-title"
        >
            Sprawdzanie...
        </div>


        <div
            id="statusText"
            class="status-text"
        >
            Pobieranie statusu stacji...
        </div>

    </div>


    <div class="actions">

        <button
            class="action open-button"
            onclick="changeStationStatus(true)"
        >

            🟢 OTWÓRZ STACJĘ

        </button>


        <button
            class="action close-button"
            onclick="changeStationStatus(false)"
        >

            🔴 ZAMKNIJ STACJĘ

        </button>

    </div>


    <div
        id="message"
        class="message"
    ></div>

</section>

</main>



<script>


const ACCESS_CODE =
    "Zarząd_Mazowieckie_Paliwa";


function login() {

    const input =
        document
            .getElementById("accessCode")
            .value;

    const error =
        document
            .getElementById("loginError");


    if (input === ACCESS_CODE) {

        document
            .getElementById("loginScreen")
            .style.display = "none";


        document
            .getElementById("managementPanel")
            .style.display = "block";


        error.style.display = "none";


        loadStatus();

        return;
    }


    error.style.display = "block";
}


document
    .getElementById("accessCode")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );



async function loadStatus() {

    try {

        const response =
            await fetch("/api/station");


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Błąd"
            );

        }


        updateStatus(data.is_open);


    } catch (error) {

        console.error(error);

        document
            .getElementById("statusTitle")
            .textContent =
                "Błąd";


        document
            .getElementById("statusText")
            .textContent =
                "Nie udało się pobrać statusu stacji.";

    }

}



function updateStatus(isOpen) {

    const box =
        document.getElementById("statusBox");

    const icon =
        document.getElementById("statusIcon");

    const title =
        document.getElementById("statusTitle");

    const text =
        document.getElementById("statusText");


    box.className =
        "status " +
        (
            isOpen
                ? "open"
                : "closed"
        );


    if (isOpen) {

        icon.textContent = "🟢";

        title.textContent =
            "STACJA OTWARTA";

        text.textContent =
            "Klienci mogą korzystać ze stacji.";

    } else {

        icon.textContent = "🔴";

        title.textContent =
            "STACJA ZAMKNIĘTA";

        text.textContent =
            "Stacja jest obecnie zamknięta.";

    }

}



async function changeStationStatus(isOpen) {

    const message =
        document.getElementById("message");


    message.textContent =
        "⏳ Zapisywanie...";


    try {

        const response =
            await fetch(
                "/api/station",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            is_open: isOpen
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error || "Błąd serwera"
            );

        }


        updateStatus(data.is_open);


        message.textContent =
            isOpen
                ? "✅ Stacja została otwarta."
                : "🔴 Stacja została zamknięta.";


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Nie udało się zmienić statusu.";

    }

}

</script>


</body>

</html>
